name: Cleanup Reel Watch DYIBE4hJw2J

on:
  push:
    paths:
      - ".github/workflows/cleanup-reel-watch-DYIBE4hJw2J.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove temporary watch files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf \
            watch-output/DYIBE4hJw2J \
            .github/workflows/watch-reel-DYIBE4hJw2J.yml \
            .github/workflows/export-reel-watch-DYIBE4hJw2J.yml \
            .github/workflows/cleanup-reel-watch-DYIBE4hJw2J.yml
          git commit -m "Remove temporary Reel watch files DYIBE4hJw2J"
          git push
